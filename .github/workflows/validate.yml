name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Validate structured results
        run: python -m json.tool results/m3-user0-generic-greedy.json >/dev/null
      - name: Validate user0 manifest
        run: test "$(wc -l < manifests/user0-sessions.txt)" -eq 14
