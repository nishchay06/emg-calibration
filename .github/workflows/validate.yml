name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Install staging dependency
        run: python -m pip install -r requirements/m4-staging.txt
      - name: Install lightweight training configuration dependencies
        run: python -m pip install -r requirements/m5b-config.txt
      - name: Validate structured results
        run: |
          for result in results/*.json; do
            python -m json.tool "$result" >/dev/null
          done
          python -m json.tool references/generic-greedy.json >/dev/null
          python -m json.tool references/personalized-greedy.json >/dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test command-line guards and dry runs
        run: ./tests/test_cli_guards.sh
      - name: Test parallel archive staging
        run: ./tests/test_parallel_staging.sh
      - name: Check out pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: facebookresearch/emg2qwerty
          ref: 3200d91eeb952cbed1f278e47d0cc56928334fd1
          path: upstream/emg2qwerty
          lfs: false
      - name: Verify generated test-user manifests
        run: |
          ./scripts/generate_test_user_manifests.py upstream/emg2qwerty --check
          ./scripts/generate_personalized_reference.py upstream/emg2qwerty --check
      - name: Check M5b configuration composition against pinned upstream
        run: python tests/test_adapt_config.py -v
